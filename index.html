<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVA Ciência — Seleção de Versão</title>

  <!-- Google Fonts: Exo & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --hero-dark: #0A0E1A;
      --color-primary: #223D73;
      --color-primary-mid: #384C73;
      --color-accent: #80BF41;
      --color-accent-light: #B7D996;
      --color-background: #F2F2F2;
      --color-card-bg: #FFFFFF;
      --color-foreground: #0A0E1A;
      --color-muted: #6B7280;
      --color-border: #E5E7EB;
      --font-heading: 'Exo', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--hero-dark);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft Glow Background */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(128, 191, 65, 0.12) 0%, rgba(34, 61, 115, 0.2) 45%, rgba(10, 14, 26, 0) 70%);
      pointer-events: none;
      filter: blur(60px);
    }

    .wrapper {
      width: 100%;
      max-width: 860px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .header-brand img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.75rem;
      margin-top: 1rem;
    }

    .card-choice {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #FFFFFF;
      transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card-choice:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--color-accent);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px rgba(128, 191, 65, 0.2);
    }

    .version-number {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent-light);
      margin-bottom: 0.5rem;
    }

    .version-name {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    .btn-choose {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      border-radius: 10px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 250ms ease;
    }

    .card-choice:nth-child(1) .btn-choose {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-choice:nth-child(1):hover .btn-choose {
      background: #FFFFFF;
      color: var(--hero-dark);
    }

    .card-choice:nth-child(2) {
      border-color: rgba(128, 191, 65, 0.4);
    }

    .card-choice:nth-child(2) .btn-choose {
      background: var(--color-accent);
      color: var(--hero-dark);
      box-shadow: 0 4px 14px rgba(128, 191, 65, 0.35);
    }

    .card-choice:nth-child(2):hover .btn-choose {
      background: var(--color-accent-light);
      transform: translateX(3px);
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="header-brand">
      <img src="Logo Camisa e Copo2.png" alt="Logo VIVA Ciência">
      <h1 class="brand-title">VIVA CIÊNCIA</h1>
      <p class="brand-subtitle">Selecione a versão para visualização</p>
    </div>

    <div class="grid-cards">
      <!-- Opção Versão 1 -->
      <a href="./v1/index.html" class="card-choice">
        <span class="version-number">Opção 01</span>
        <h2 class="version-name">Versão 1</h2>
        <span class="btn-choose">
          Acessar V1
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </span>
      </a>

      <!-- Opção Versão 2 -->
      <a href="./v2/index.html" class="card-choice">
        <span class="version-number">Opção 02</span>
        <h2 class="version-name">Versão 2</h2>
        <span class="btn-choose">
          Acessar V2
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </span>
      </a>
    </div>
  </div>

</body>

</html>
